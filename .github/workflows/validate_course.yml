name: Validate Course Artifacts & Presentations

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Intake Scanner
        run: |
          python engine/intake_scanner.py

      - name: Build Starter Presentation Deck
        run: |
          python starter_sample/sample_unit_spec.py

      - name: Audit Presentation Deck Compliance
        run: |
          python engine/deck_auditor.py starter_sample/sample_unit_deck.pptx

      - name: Run Sample Unit Test Lab
        run: |
          python templates/code_lab_template.py
